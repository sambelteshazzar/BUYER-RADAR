[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buyerradar"
version = "0.1.0"
description = "Buyer lead agent for social sellers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["buyerradar*"]
